<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTM Gelato - สมัครสมาชิก</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #ffb6c1; color: #fff; text-align: center; padding: 25px 0; }
        header h1 { margin: 0; font-size: 2.2em; }
        nav { background-color: #ff8fa3; display: flex; justify-content: center; flex-wrap: wrap; padding: 10px 0; }
        nav a { color: white; text-decoration: none; padding: 10px 15px; margin: 2px 5px; font-weight: bold; border-radius: 4px; transition: background 0.3s; }
        nav a:hover, nav a.active-link { background-color: hsl(349, 89%, 75%); }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        h2 { color: #ff889e; border-bottom: 2px solid #ffe5ec; padding-bottom: 8px; }
        ul { line-height: 1.8; }
    </style>
</head>
<body>
    <header>
        <h1>ASTM Gelato Bar</h1>
        <p>เจลาโต้โฮมเมดพรีเมียม สไตล์อิตาลีแท้ๆ</p>
    </header>
    <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="menu.html">เมนูไอศกรีม</a>
        <a href="about.html">เกี่ยวกับเรา</a>
        <a href="promo.html">โปรโมชั่น</a>
        <a href="register.html" class="active-link">สมัครสมาชิก</a>
        <a href="contact.html">ติดต่อเรา</a>
    </nav>
    <div class="container">
        <h2>สมัครสมาชิกเพื่อรับสิทธิพิเศษ</h2>
        <p>สมัครสมาชิกวันนี้ รับฟรีคูปองส่วนลด 50 บาท สำหรับซื้อเจลาโต้สกู๊ปแรก พร้อมสะสมแต้มทุกการใช้จ่ายเพื่อแลกรับของรางวัลมากมาย!</p>
        
        <form onsubmit="event.preventDefault(); alert('สมัครสมาชิกสำเร็จ! ยินดีต้อนรับสู่ครอบครัว ASTM Gelato');">
            <div class="form-group">
                <label for="fullname">ชื่อ - นามสกุล:</label>
                <input type="text" id="fullname" placeholder="กรอกชื่อและนามสกุลของคุณ" required>
            </div>
            <div class="form-group">
                <label for="email">อีเมล:</label>
                <input type="email" id="email" placeholder="astm@email.com" required>
            </div>
            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์มือถือ:</label>
                <input type="tel" id="phone" placeholder="099-999-9999" required>
            </div>
            <button type="submit" class="submit-btn">ยืนยันการสมัครสมาชิก</button>
            <button type="reset" class="re">รีเซ็ท</button>
        </form>
    </div>
</body>
</html>
